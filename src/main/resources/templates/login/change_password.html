<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:tiles="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="">
        <meta name="author" content="">

        <title>Forgot Password</title>

        <!-- Bootstrap Core CSS -->
        <link href="../css/bootstrap.min.css" rel="stylesheet">

        <!-- MetisMenu CSS -->
        <link href="../css/metisMenu.min.css" rel="stylesheet">

        <!-- Custom CSS -->
        <link href="../css/startmin.css" rel="stylesheet">

        <!-- Custom Fonts -->
        <link href="../css/font-awesome.min.css" rel="stylesheet" type="text/css">

        <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
        <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
        <!--[if lt IE 9]>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/respond.js/1.4.2/respond.min.js"></script>
        <![endif]-->
    </head>
    <body class="fullscreen">
        <nav class="navbar navbar-inverse navbar-fixed-top" role="navigation">
            <div class="navbar-header">
                <label class="navbar-brand" >Simple Cashier</label>
            </div>

            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>

            <ul class="nav navbar-nav navbar-right navbar-top-links">
                <li class="dropdown">
                    <a class="dropdown-toggle" data-toggle="dropdown" href="#" aria-expanded="true">
                        <i class="fa fa-user fa-fw"></i> <span id="navUser"></span> <b class="caret"></b>
                    </a>
                    <ul class="dropdown-menu dropdown-user">
                        <li>
                            <a href="/logout"><i class="fa fa-sign-out fa-fw"></i> Logout</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>

        <aside class="sidebar navbar-default" role="navigation">
            <div class="sidebar-nav navbar-collapse active">
                <ul class="nav" id="side-menu">
                    <li class="sidebar-search">
                        <label id="greetingName">Hello, there!</label>
                    </li>
                </ul>
            </div>
        </aside>

        <div class="wrapper" align="center" style="padding-top: 10%">
            <section class="content">
                <div style="width : 35%">
                    <div class="header">
                        <h2 class="title">Simple Cashier | Change Password</h2>
                    </div>
                    <form id="forgotPasswordForm" name="forgotPasswordForm">

                        <div id="userNameGroup" class="form-group" style="display: none">
                            <div class="row">
                                <div class="col">
                                    <p class="text-left">Username</p>
                                </div>
                                <div class="col-6">
                                    <input type="text" class="form-control" id="username" name="username" placeholder="Username">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="row">
                                <div class="col">
                                    <p class="text-left">Old Password</p>
                                </div>
                                <div class="col-6">
                                    <input type="password" class="form-control" id="oldPassword" name="oldPassword" placeholder="Old Password" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="row">
                                <div class="col">
                                    <p class="text-left">New Password</p>
                                </div>
                                <div class="col-6">
                                    <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="New Password" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="row">
                                <div class="col-6">
                                    <p class="text-left">Confirm New Password</p>
                                </div>
                                <div class="col">
                                    <input type="password" class="form-control" id="confirmNewPassword" name="confirmNewPassword" placeholder="Confirm New Password" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="row">
                                <div class="col-lg-6">
                                    <button type="submit" id="confirmBtn" class="btn btn-primary btn-block">Submit</button>
                                </div>
                                <div class="col-lg-6">
                                    <button type="button" id="cancelBtn" class="btn btn-danger btn-block">Cancel</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </section>
        </div>
        <!-- jQuery -->
        <script src="../js/jquery.min.js"></script>

        <!-- Sweet Alert -->
        <script src="../js/sweetalert.min.js"></script>

        <!-- Bootstrap Core JavaScript -->
        <script src="../js/bootstrap.min.js"></script>

        <!-- Metis Menu Plugin JavaScript -->
        <script src="../js/metisMenu.min.js"></script>

        <!-- Custom Theme JavaScript -->
        <script src="../js/startmin.js"></script>

        <!-- Service -->
        <script src="../js/service/_data.js"></script>
        <script src="../js/service/changePassword.js"></script>
        <script src="../js/service/cancel.js"></script>
        <script src="../js/service/csrfToken.js"></script>
        <script src="../js/service/menu.js"></script>

    </body>
</html>
