<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="">
        <meta name="author" content="">
        <title>Order Info</title>

        <!-- Bootstrap Core CSS -->
        <link href="../../css/bootstrap.min.css" rel="stylesheet">

        <!-- MetisMenu CSS -->
        <link href="../../css/metisMenu.min.css" rel="stylesheet">

        <!-- DataTables CSS -->
        <link href="../../css/dataTables/dataTables.bootstrap.css" rel="stylesheet">

        <!-- DataTables Responsive CSS -->
        <link href="../../css/dataTables/dataTables.responsive.css" rel="stylesheet">

        <!-- Custom CSS -->
        <link href="../../css/startmin.css" rel="stylesheet">

        <!-- Custom Fonts -->
        <link href="../../css/font-awesome.min.css" rel="stylesheet" type="text/css">

        <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
        <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
        <!--[if lt IE 9]>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/respond.js/1.4.2/respond.min.js"></script>
        <![endif]-->
    </head>
    <body>
        <nav class="navbar navbar-inverse navbar-fixed-top" role="navigation">
            <div class="navbar-header">
                <label class="navbar-brand" >Simple Cashier</label>
            </div>

            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>

            <ul class="nav navbar-nav navbar-right navbar-top-links">
                <li class="dropdown">
                    <a class="dropdown-toggle" data-toggle="dropdown" href="#" aria-expanded="true">
                        <i class="fa fa-user fa-fw"></i> <span id="navUser"></span> <b class="caret"></b>
                    </a>
                    <ul class="dropdown-menu dropdown-user">
                        <li>
                            <a href="/logout"><i class="fa fa-sign-out fa-fw"></i> Logout</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>

        <aside class="sidebar navbar-default" role="navigation">
            <div class="sidebar-nav navbar-collapse active">
                <ul class="nav" id="side-menu">
                    <li class="sidebar-search">
                        <label id="greetingName">Hello, there!</label>
                    </li>
                </ul>
            </div>
        </aside>

        <div id="page-wrapper">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="panel panel-default">
                            <div id="orderHeading" class="panel-heading">
                                Order Information
                            </div>
                            <div class="panel-body">

                                <form role="form" id="orderForm" name="orderForm">
                                    <div class="col-lg-6">
                                        <div class="form-group">
                                            <label>Order Number</label>
                                            <input id="orderNumber"  name="orderNumber" class="form-control" placeholder="" readonly>
                                        </div>
                                        <div class="form-group">
                                            <label>Total Price</label>
                                            <input id="totalPrice"  name="totalPrice" class="form-control" type="text" placeholder="" min="0" readonly>
                                        </div>
                                        <div class="form-group">
                                            <label>Cash paid by customer</label>
                                            <input id="cashPaidByCustomer"  name="cashPaidByCustomer" class="form-control" type="number" step="0.01" placeholder="" min="0" required>
                                        </div>
                                        <div class="form-group">
                                            <label>Payment Method</label>
                                            <select id="paymentMethod" name="paymentMethod" class="form-control" required>
                                                <option>OTHERS</option>
                                            </select>
                                        </div>
                                        <div id="uploadImageGroup" class="form-group">
                                            <label>Upload additional image for this order</label>
                                            <input id="orderImage"  name="orderImage" type="file" accept="image/*">
                                        </div>
                                        <div class="form-group">
                                            <button type="button" id="removeImageBtn" class="btn btn-warning">
                                                <i class="fa fa-fw" aria-hidden="true" >&#xf1f8</i>Remove Image
                                            </button>
                                        </div>
                                        <div class="form-group">
                                            <img id="previewOrderImage" alt="Image Preview">
                                        </div>
                                    </div>
                                    <div class="col-lg-6">
                                        <div class="form-group">
                                            <label>Order Status</label>
                                            <input id="orderStatus"  name="orderStatus" class="form-control" placeholder="" readonly>
                                        </div>
                                        <div class="form-group">
                                            <label>Total Ordered Item</label>
                                            <input id="totalOrderedItem"  name="totalOrderedItem" class="form-control" type="number" placeholder="" min="0" readonly>
                                        </div>
                                        <div class="form-group">
                                            <label>Cash paid by customer in IDR</label>
                                            <input id="cashPaidByCustomerWithCurrency"  name="cashPaidByCustomerWithCurrency" class="form-control" type="text" placeholder="" min="0" readonly>
                                        </div>
                                        <div class="form-group">
                                            <label>Change in idr</label>
                                            <input id="changeWithCurrency"  name="changeWithCurrency" class="form-control" type="text" placeholder="" min="0" readonly>
                                        </div>
                                        <div class="form-group">
                                            <label>Notes</label>
                                            <textarea id="notes"  name="notes" class="form-control" rows="5" style="resize: none;" placeholder="Describe additional info about this order if needed"></textarea>
                                        </div>
                                        <div id="formBtn" class="form-group">
                                            <button type="button" id="cancelBtn" class="btn btn-danger">
                                                Return
                                            </button>
                                            <button type="submit" id="submitBtn" class="btn btn-success">
                                                <i class="fa fa-download fa-fw"></i>Submit
                                            </button>
                                            <button type="submit" id="submitAndSendMailBtn" class="btn btn-info">
                                                <i class="fa fa-envelope fa-fw"></i><span id="sendMailBtn">Submit and Send Mail</span>
                                            </button>
                                            <button type="button" id="downloadBtn" class="btn btn-primary" style="display: none">
                                                <i class="fa fa-fw fa-download" aria-hidden="true" title="Copy to use download"></i>
                                                Download PDF
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>

                            <div class="row">
                                <div class="col-lg-12">
                                    <div class="panel panel-default">
                                        <!-- /.panel-heading -->
                                        <div class="panel-body">
                                            <div class="table-responsive">
                                                <center>
                                                    <table class="table table-striped table-bordered table-hover" id="ordered-items-dataTables">
                                                        <thead>
                                                        <tr>
                                                            <th>No.</th>
                                                            <th>Product Name</th>
                                                            <th>Price per unit</th>
                                                            <th>Total Item</th>
                                                            <th>Total Price</th>
                                                        </tr>
                                                        </thead>
                                                    </table>
                                                </center>
                                            </div>
                                        </div>
                                        <!-- /.panel-body -->
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
